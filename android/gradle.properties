org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# 插件模块（quickjs / jni / cmake）互不依赖，跨项目并行；本地与 CI 共用同一份，
# 不再靠 CI 的 GRADLE_OPTS 注入。
org.gradle.parallel=true
android.useAndroidX=true

# app 模块走 AGP9 内置 Kotlin，必须显式写 true：
# 缺省时 Flutter 的 DisableBuiltInKotlinMigration 会自动补上 false。
# Kotlin 编译器版本由 settings.gradle 的 KGP 声明决定。
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# 最新优先策略下的长期例外：app 的 Java/Kotlin target 26 与第三方插件的
# 17/11 并存，AGP9 默认按错误处理。这是兼容开关，不是临时 hack；等常用插件
# 都把 target 提到 26（或本仓决定把 target 降到 17）后再删除。
kotlin.jvm.target.validation.mode=warning
