org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true

# app 模块走 AGP9 内置 Kotlin，必须显式写 true：
# 缺省时 Flutter 的 DisableBuiltInKotlinMigration 会自动补上 false。
# Kotlin 编译器版本由 settings.gradle 的 KGP 声明决定。
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# 部分插件 Java/Kotlin target 不一致，AGP9 默认报错；降级为警告
kotlin.jvm.target.validation.mode=warning
