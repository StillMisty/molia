org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true

# app 模块走 AGP9 内置 Kotlin，必须显式写 true：
# 缺省时 Flutter 的 DisableBuiltInKotlinMigration 会自动补上 false。
# Kotlin 编译器版本由 settings.gradle 的 KGP 声明决定。
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# 部分插件 Java/Kotlin target 不一致，AGP9 默认报错；降级为警告
kotlin.jvm.target.validation.mode=warning

# 扫码（mobile_scanner）走 **unbundled** ML Kit：识别模型由 Google Play 服务
# 按需下载，APK 里不再打包 bundled 模型。
# 取舍与出处：mobile_scanner 的 android/build.gradle.kts 按该属性二选一——
# bundled `com.google.mlkit:barcode-scanning:17.3.0`（AAR 9.9MB，arm64 的
# .so 4.72MB）vs unbundled `com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1`
# （AAR 0.5MB）；本项目扫码是可选入口，不值得为它让所有安装包变胖。
# 代价：无 GMS 的设备没有扫码入口（Dart 侧按 GMS 可用性门控），有 GMS 但
# 模型首次下载失败时给「改用粘贴」出路（见 sync_pairing_scanner.dart）。
# iOS 不受影响：darwin 实现走系统 Vision/AVFoundation。
dev.steenbakker.mobile_scanner.useUnbundled=true
