plugins {
    // Kotlin 由 AGP9 内置 Kotlin 支持编译，本模块不 apply kotlin-android
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android Gradle plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "top.stillmisty.molia"
    compileSdk = 37
    // 37.2 是当前稳定版 Android 17 SDK；targetSdk 仍取主版本 37。
    compileSdkMinor = 2
    buildToolsVersion = "37.0.0"
    ndkVersion = "30.0.16248370"

    // Java 27 字节码本身可编译（JDK 27 / Gradle 9.9.1 / D8 9.5.29 接受 class 71），
    // 但 KGP 2.4.21 的 JvmTarget 上限是 JVM_26；等 Kotlin 2.5 稳定后再把
    // compileOptions 与 jvmTarget 一起提到 27，避免 Java/Kotlin 目标不一致。
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_26
        targetCompatibility = JavaVersion.VERSION_26
    }

    defaultConfig {
        applicationId = "top.stillmisty.molia"
        minSdk = 35
        targetSdk = 37
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // 只保留应用实际支持的语言（英文 + 简体中文），减小 APK 资源体积
        resourceConfigurations.addAll(["en", "zh-rCN"])
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            // 移除 AAPT 静态分析判定未引用的资源（R.* 代码引用与清单/布局引用会保留）
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            // nativeapi 的 C++ 核（cnativeapi）只被桌面 IO 实现使用：
            // lib/services/window/*_io.dart 与 lib/services/global_hotkeys_io.dart，
            // Android 侧所有入口都有 Platform.isLinux/Windows/macOS 守卫，运行期
            // 不会 dlopen 它。但 Dart hooks 仍会为 Android 编译并打包 native
            // asset（Dart tree-shaking 管不到 native asset），故在此显式剔除。
            // 将来 Android 真要调 nativeapi 时必须删掉这条排除并补测试；
            // 切勿顺手剔除 libsqlite3.so（docs/pitfalls.md #28）、quickjs、
            // dartjni 等运行期真正需要的库。
            excludes += ['**/libcnativeapi.so']
            // 发布 APK 为直接分发（无 Play/AAB 的分发侧压缩），压缩 native 库以减小下载体积
            useLegacyPackaging = true
        }
        dex {
            // 同上，压缩 dex（minSdk≥28 时 AGP 默认不压缩以支持 mmap 直载，约 2.2MB → 1.0MB）。
            useLegacyPackaging = true
        }
    }
}

// 内置 Kotlin 的编译选项入口：jvmTarget 与 compileOptions 统一取 JVM_26
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_26
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    // 仅用运行时 API（Glide.with/load/into），未使用 GlideApp 生成 API，
    // 因此不需要 glide:compiler 注解处理器。
    implementation 'com.github.bumptech.glide:glide:5.0.9'

    // Jetify annotations
    implementation 'androidx.annotation:annotation:1.11.0'
}

repositories {
    maven { url 'https://dl.google.com/dl/android/maven2' }
    google()
    mavenCentral()
}

flutter {
    source = "../.."
}
