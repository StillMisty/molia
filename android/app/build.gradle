plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "top.stillmisty.molia"
    compileSdk = 37
    ndkVersion = "30.0.16248370"

    // Java/Kotlin 目标取工具链上限：Kotlin 2.4.21 最高支持 JVM_26（JvmTarget 枚举上限），
    // 由 JDK 27 编译出 target 26 字节码，D8 正常脱糖。
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_26
        targetCompatibility = JavaVersion.VERSION_26
    }

    kotlinOptions {
        jvmTarget = '26'
    }

    defaultConfig {
        applicationId = "top.stillmisty.molia"
        minSdk = 37
        targetSdk = 37
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // 只保留应用实际支持的语言（英文 + 简体中文），减小 APK 资源体积
        resourceConfigurations.addAll(["en", "zh-rCN"])
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            // 移除 AAPT 静态分析判定未引用的资源（R.* 代码引用与清单/布局引用会保留）
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            // sqflite_common_ffi 仅桌面端（Linux/Windows）使用；其传递依赖 sqlite3
            // 会为 Android 一并生成 native asset（libsqlite3.so，约 1.7MB），
            // Android 实际走系统 SQLite（sqflite_android），这里显式剔除。
            excludes += ["**/libsqlite3.so"]

            // 发布 APK 为直接分发（无 Play/AAB 的分发侧压缩），压缩 native 库以减小下载体积
            useLegacyPackaging = true
        }
        dex {
            // 同上，压缩 dex（minSdk≥28 时 AGP 默认不压缩以支持 mmap 直载，约 2.2MB → 1.0MB）。
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    // 仅用运行时 API（Glide.with/load/into），未使用 GlideApp 生成 API，
    // 因此不需要 glide:compiler 注解处理器。
    implementation 'com.github.bumptech.glide:glide:5.0.9'

    // Jetify annotations
    implementation 'androidx.annotation:annotation:1.11.0'
}

repositories {
    maven { url "https://jitpack.io" }
    maven { url 'https://dl.google.com/dl/android/maven2' }
    google()
    mavenCentral()
}

flutter {
    source = "../.."
}
