pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // 引号必须与 version 一致：Flutter 的 AGP 版本解析器按同一种引号匹配，
    // 混用会让 `flutter analyze --suggestions` 报 AGP Version: null。
    id "com.android.application" version "9.5.1" apply false
    // AGP9 内置 Kotlin 直接复用类路径上的 KGP 当编译器（AGP 自带下限 2.2.10），
    // 此处 apply false 只做版本声明、不下发到 app 模块。
    // 需保持 2.4.x：JvmTarget.JVM_26 是 2.4 起的枚举值（2.2.x 上限 JVM_24）。
    id "org.jetbrains.kotlin.android" version "2.4.21" apply false
}

// 依赖仓库在根 build.gradle 统一声明；Flutter Gradle 插件会再追加引擎仓库
// （download.flutter.io），所以这里不使用 PREFER_SETTINGS/FAIL_ON_PROJECT_REPOS：
// 那会丢掉插件动态追加的仓库，属于把上游行为当成可覆盖项。

include ":app"
