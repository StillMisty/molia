// 依赖仓库只在这里声明；Flutter 插件会追加 download.flutter.io 引擎仓库。
// 不要在 app 模块或 settings.gradle 再复制一份。
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9 移除了 Project.buildDir，改用 layout.buildDirectory
rootProject.layout.buildDirectory = rootProject.file("../build")
subprojects {
    project.layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
