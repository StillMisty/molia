name: molia
description: "Molia（茉咏）—— 多音源本地音乐播放器"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  logger: ^2.4.0
  intl: ^0.20.2
  path: ^1.9.0

  flutter_secure_storage: ^11.2.0
  http: ^1.3.0
  crypto: ^3.0.6
  provider: ^6.1.2
  cached_network_image: ^4.0.4
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  collection: ^1.19.0
  sqflite:
  path_provider: ^2.1.4
  audio_session: ^0.2.4
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  pointycastle: ^4.0.0
  html_unescape: ^2.0.0
  material_color_utilities: ^0.13.0
  dynamic_color: ^2.1.0
  gal: ^2.3.3
  animations: ^3.0.0
  flutter_js: ^0.8.7
  connectivity_plus: ^7.3.2
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.19
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
  material_3_expressive: ^1.1.6
  sqflite_common_ffi: ^2.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/adaptive_icon_monochrome.png
    - assets/icons/molia_logo.png
    - assets/icons/molia_logo_outline.png
    - assets/lx/
