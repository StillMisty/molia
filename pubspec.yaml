name: molia
description: "Molia（茉咏）—— 多音源本地音乐播放器"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.1.0-beta.11+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  logging: ^1.3.0
  intl: ^0.20.2
  path: ^1.9.0

  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6
  provider: ^6.1.2
  cached_network_image: ^4.0.4
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  collection: ^1.19.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.4
  audio_session: ^0.2.4
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  pointycastle: ^4.0.0
  material_color_utilities: ^0.13.0
  dynamic_color: ^2.1.0
  gal: ^2.3.3
  # 7.3.2 把 nm 提到 0.6（依赖 dbus 0.8），与 audio_service_mpris 的
  # dbus ^0.7.10 冲突；7.3.1 是同一行为线的上一补丁版，保留 Linux 修复。
  connectivity_plus: 7.3.1
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  # media_kit 原生库按平台拆分：换 media_kit_libs_audio 会让 Android 每个 ABI
  # 的 release APK +2.98MB（实测），Android/iOS/macOS 均会多打包 libmpv。
  # 依据与复现见 docs/media_kit_native_libs.md，改这里前先读它。
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  flutter_media_session: ^3.0.9
  # Linux 的 MPRIS 后端：只使用它的 Dart 平台接口（不引入 audio_service 本体）。
  audio_service_mpris: ^0.2.1
  audio_service_platform_interface: ^0.1.3
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
  # 1.1.7 起弹层宿主在 guard 非空时也接管预测返回手势（跟手预览 + 提交后被
  # guard 拒绝则回弹），勿降级到 1.1.6 及以下（那条链路会退化成「无预览」）。
  material_3_expressive: ^1.1.7
  motor: ^1.1.0
  window_manager: ^0.5.2
  # 窗口几何恢复要枚举显示器做可见性校验：window_manager 的传递依赖，
  # 这里提升为直接依赖（版本对齐 lock 里已有的 0.2.2）。
  screen_retriever: ^0.2.2
  quickjs_engine: ^0.1.6
  dio: ^5.11.1
  package_info_plus: ^10.2.2
  tray_manager: ^0.8.0
  system_hotkeys: ^0.2.0
  system_hotkeys_linux: ^0.2.1
  # 配对码二维码是纯 Dart 生成（qrcode 算法 + CustomPaint 自绘），无原生依赖。
  qr: ^4.0.0
  # 只用于 Android / iOS 扫码（桌面不构建扫码入口；权限由插件自管，
  # 不要再引入 permission_handler，见 docs/pitfalls.md 40）。
  mobile_scanner: ^7.4.2
  # 全局热键（系统级，窗口失焦也生效）：桌面三平台走系统注册 API
  # （Windows RegisterHotKey / macOS RegisterEventHotKey / Linux
  # org.freedesktop.portal.GlobalShortcuts 桌面门户）。Linux 实现是纯 Dart +
  # D-Bus（无 keybinder 之类原生依赖，X11 / Wayland 通用）；精简桌面（无
  # xdg-desktop-portal 后端）注册会失败，由 GlobalHotkeys 降级记录。
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/adaptive_icon_monochrome.png
    - assets/icons/app_icon.png
    - assets/icons/molia_logo.png
    - assets/icons/molia_logo_outline.png
    - assets/icons/tray_icon.png
    - assets/lx/
