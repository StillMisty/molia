name: molia
description: "Molia —— 多音源本地音乐播放器"

publish_to: "none"

version: 0.2.0-beta.3+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  logging: ^1.3.0
  intl: ^0.20.2
  path: ^1.9.0
  image: ^4.13.0

  crypto: ^3.0.6
  provider: ^6.1.2
  cached_network_image: ^4.0.7
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  drift: ^2.35.4
  sqlite3: ^3.9.1
  path_provider: ^2.1.4
  audio_session: ^0.2.4
  share_plus: ^13.3.1
  file_picker: ^13.3.3
  pointycastle: ^4.0.0
  material_color_utilities: ^0.13.0
  dynamic_color: ^2.1.0
  connectivity_plus: ^7.3.2
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  flutter_media_session: ^3.1.0
  # 1.0.0-beta.3 是首个支持 dbus ^0.8 的版本（也补了 MPRIS Seek / SetPosition）；
  # 正式版发布后改回稳定约束。
  audio_service_mpris: ^1.0.0-beta.4
  audio_service_platform_interface: ^0.1.3
  material_ui: ^1.11.0
  material_3_expressive: ^1.2.1
  motor: ^1.1.0
  quickjs_engine: ^0.1.7
  dio: ^5.11.1
  package_info_plus: ^10.2.2
  tray_manager: ^0.9.0
  nativeapi: ^0.6.0
  nativeapi_flutter: ^0.6.0
  qr: ^4.0.1
  flutter_cache_manager: ^3.5.0
  file: ^7.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  fake_async: ^1.3.3
  shared_preferences_platform_interface: ^2.4.2
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/adaptive_icon_monochrome.png
    - assets/icons/app_icon.png
    - assets/icons/molia_logo.png
    - assets/icons/molia_logo_outline.png
    - assets/icons/tray_icon.png
    - assets/lx/
