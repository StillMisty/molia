name: molia
description: "Molia（茉咏）—— 多音源本地音乐播放器"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.1.0-beta.3+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  logging: ^1.3.0
  intl: ^0.20.2
  path: ^1.9.0

  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6
  provider: ^6.1.2
  cached_network_image: ^4.0.4
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  collection: ^1.19.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.4
  audio_session: ^0.2.4
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  pointycastle: ^4.0.0
  material_color_utilities: ^0.13.0
  dynamic_color: ^2.1.0
  gal: ^2.3.3
  animations: ^3.0.0
  connectivity_plus: ^7.3.2
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  # media_kit 原生库按平台拆分：换 media_kit_libs_audio 会让 Android 每个 ABI
  # 的 release APK +2.98MB（实测），Android/iOS/macOS 均会多打包 libmpv。
  # 依据与复现见 docs/media_kit_native_libs.md，改这里前先读它。
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.19
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
  material_3_expressive: ^1.1.6
  motor: ^1.1.0
  window_manager: ^0.5.2
  quickjs_engine: ^0.1.6
  dio: ^5.11.1
  package_info_plus: ^10.2.2
  # 音频标签写入（下载嵌入歌词/封面）：纯 Dart，MP3/FLAC/OGG/Opus/MP4 读写。
  # 选纯 Dart 而非 FFI/TagLib 绑定：无需引入原生构建链（CI / 各平台一致）。
  phonic: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/adaptive_icon_monochrome.png
    - assets/icons/molia_logo.png
    - assets/icons/molia_logo_outline.png
    - assets/lx/
