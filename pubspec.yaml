name: molia
description: "Molia —— 多音源本地音乐播放器"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.1.0-beta.23+1

environment:
  # 与 AGENTS.md 工具链和 pubspec.lock 的 sdks 段对齐：drift_flutter 要求
  # Dart ≥3.10、material_3_expressive 要求 Dart ≥3.13 / Flutter ≥3.47。
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  logging: ^1.3.0
  intl: ^0.20.2
  path: ^1.9.0
  # 自定义封面归一化（解码 EXIF / 缩放 / JPEG）。此前是传递依赖，直接
  # import package:image 后提升为直接依赖，版本与 lock 保持一致。
  image: ^4.12.0

  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6
  provider: ^6.1.2
  cached_network_image: ^4.0.4
  shared_preferences: ^2.3.3
  # shared_preferences_android 必须 ≥2.5.2：2.5.0/2.5.1 的 Pigeon JNI 实现与
  # release 的 R8 混淆冲突（启动读偏好抛 NoSuchMethodError，见 docs/pitfalls.md
  # #56），2.5.2 已补 consumer-rules.pro。这里不再直接依赖，由
  # shared_preferences 传递解析（当前 2.5.3）。
  url_launcher: ^6.3.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.4
  audio_session: ^0.2.4
  share_plus: ^13.3.1
  file_picker: ^13.2.0
  pointycastle: ^4.0.0
  # 0.13.1 不可解析：Flutter SDK 自己的 packages/flutter/pubspec.yaml 精确钉
  # `material_color_utilities: 0.13.0`（dynamic_color / material_ui 都只要求
  # ^0.13.0）。复评条件：Flutter 升到 SDK 自己换成 ≥0.13.1 的版本时一并跟上。
  material_color_utilities: ^0.13.0
  dynamic_color: ^2.1.0
  # 7.3.2 把 nm 提到 0.6（依赖 dbus 0.8），与 audio_service_mpris 的
  # dbus ^0.7.10 冲突；7.3.1 是同一行为线的上一补丁版，保留 Linux 修复。
  # 复评条件：audio_service_mpris 放出支持 dbus ^0.8 的版本（0.2.1 仍钉 0.7.10），
  # 或本仓库不再需要它的 Linux 平台接口时，再一起升 nm / dbus / connectivity_plus
  connectivity_plus: 7.3.1
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  # media_kit 原生库按平台拆分：换 media_kit_libs_audio 会让 Android 每个 ABI
  # 的 release APK +2.98MB（实测），Android/iOS/macOS 均会多打包 libmpv。
  # 依据与复现见 docs/media_kit_native_libs.md，改这里前先读它。
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  flutter_media_session: ^3.0.9
  # Linux 的 MPRIS 后端：只使用它的 Dart 平台接口（不引入 audio_service 本体）。
  audio_service_mpris: ^0.2.1
  audio_service_platform_interface: ^0.1.3
  material_ui: ^1.8.0
  material_3_expressive: ^1.2.0
  motor: ^1.1.0
  window_manager: ^0.5.2
  # 窗口几何恢复要枚举显示器做可见性校验：window_manager 的传递依赖，
  # 这里提升为直接依赖（版本对齐 lock 里已有的 0.2.2）。
  # 复评条件：window_manager 0.5.2（当前最新）仍钉 `screen_retriever: ^0.2.2`，
  # 上游放宽到 ^0.3.0 后这里才能跟（0.3.0 不在可解析集内）。
  screen_retriever: ^0.2.2
  quickjs_engine: ^0.1.6
  dio: ^5.11.1
  package_info_plus: ^10.2.2
  tray_manager: ^0.8.0
  system_hotkeys: ^0.2.0
  system_hotkeys_linux: ^0.2.1
  # 全局热键（系统级，窗口失焦也生效）：桌面三平台走系统注册 API
  # （Windows RegisterHotKey / macOS RegisterEventHotKey / Linux
  # org.freedesktop.portal.GlobalShortcuts 桌面门户）。Linux 实现是纯 Dart +
  # D-Bus（无 keybinder 之类原生依赖，X11 / Wayland 通用）；精简桌面（无
  # xdg-desktop-portal 后端）注册会失败，由 GlobalHotkeys 降级记录。
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/adaptive_icon_monochrome.png
    - assets/icons/app_icon.png
    - assets/icons/molia_logo.png
    - assets/icons/molia_logo_outline.png
    - assets/icons/tray_icon.png
    - assets/lx/
