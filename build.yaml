# drift 代码生成与 schema 快照配置。
#
# case_from_dart_to_sql: preserve —— 表/列 SQL 名沿用 Dart getter 的
# camelCase（drift 默认会转 snake_case）；SQL 文本 / JSON 键（同步、备份）
# 与本文件里的手写 SQL 都按 camelCase 对齐。
#
# databases: schema 快照（drift_schemas/）与 `make-migrations` 的开关：
# 改表结构时提 schemaVersion → `dart run drift_dev make-migrations` 生成快照
# → 用 stepByStep 写增量迁移并保留数据（ADR-0005）。
targets:
  $default:
    builders:
      drift_dev:
        options:
          case_from_dart_to_sql: preserve
          databases:
            molia: lib/data/molia_database.dart
