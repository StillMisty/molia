# drift 代码生成配置。
#
# case_from_dart_to_sql: preserve —— 表/列 SQL 名沿用 Dart getter 的
# camelCase（drift 默认会转 snake_case）；SQL 文本 / JSON 键（同步、备份）
# 与本文件里的手写 SQL 都按 camelCase 对齐。
#
# 不做 schema 快照 / 迁移代码生成：结构变更 = 整库重建（见 ADR-0005 修订）。
targets:
  $default:
    builders:
      drift_dev:
        options:
          case_from_dart_to_sql: preserve
