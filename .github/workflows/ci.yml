name: CI

# PR / main 的快速校验：静态分析 + 单元测试。
# 发布构建走 release.yml；真实引擎的集成测试走 integration.yml。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pubspec.lock 锁定的是国内镜像源，CI 必须同源，否则 pub 会重写 lock。
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  analyze-test:
    name: Analyze / Test
    # 明确固定 runner 版本（ubuntu-latest 正在迁移到 Ubuntu 26，避免被动换基线）。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # native assets（cnativeapi 等）的构建 hook 需要 GTK / X11 开发包：
      # 缺少时 `flutter analyze` / `flutter test` 会直接死在 native assets 阶段
      # （Bad state: pkg-config --cflags gtk+-3.0 x11 xi failed）。
      # 依赖清单与 release.yml 的 Linux job 保持一致，改这里前先对照那边。
      - name: 系统依赖（native assets：GTK / X11）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libx11-dev libxi-dev ninja-build libglu1-mesa

      # 版本与 AGENTS.md 的工具链表保持一致（改这里前先改 AGENTS.md）。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get --enforce-lockfile

      - name: analyze（0 error / 0 warning）
        run: flutter analyze --no-pub

      - name: test
        run: flutter test --no-pub

  # 手动触发的 Windows 试构建：analyze / test 跑在 Linux 上，覆盖不到
  # windows/runner 的 C++（任务栏缩略图按钮、应用身份注册、安装器）。
  # 只在手动触发时跑（PR / push 不额外花时间）；产物是 Actions artifact
  # （便携 zip + 安装器），不发 Release、不碰其他平台。
  windows-dev:
    name: Windows 试构建（手动）
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 版本与 AGENTS.md 的工具链表保持一致（改这里前先改 AGENTS.md）。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get --enforce-lockfile

      - name: 安装 Inno Setup（Windows 安装器编译器）
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: 构建 + 打包（便携 zip + 安装器 setup.exe）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 版本取 pubspec.yaml 的基础版本；构建号取 run_number（与发布同源，
          # 便于和已装的版本比较新旧）。产物名带 `-dev<build>` 便于区分试构建。
          $line = Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1
          $v = ($line.Line -replace '^version:\s*', '') -replace '\+.*$', ''
          $build = "${{ github.run_number }}"
          $label = "$v-dev$build"

          flutter build windows --release --build-name "$v" --build-number "$build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $stage = "dist/molia-$label-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" $stage
          Compress-Archive -Path $stage -DestinationPath "dist/molia-$label-windows-x64.zip" -Force

          # 安装器的版本资源必须是纯数字（预发布后缀进不了 x.y.z.w）。
          $parts = @(($v -split '-')[0].Split('.'))
          while ($parts.Count -lt 3) { $parts += '0' }
          $verNum = (($parts[0..2] + $build) -join '.')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$label" "/DVersionNum=$verNum" `
            "/DSourceDir=$PWD\$stage" "/DOutputDir=$PWD\dist" `
            "windows/installer/molia.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-dev
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
