name: CI

# PR / main 的快速校验：静态分析 + 单元测试。
# 发布构建走 release.yml；真实引擎的集成测试不进 CI，本地用 tool/agent/test.sh
# 在 Linux / Android 上运行，CI 只跑 analyze + 单元测试。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pubspec.lock 锁定的是国内镜像源，CI 必须同源，否则 pub 会重写 lock。
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  analyze-test:
    name: Analyze / Test
    # 明确固定 runner 版本（ubuntu-latest 正在迁移到 Ubuntu 26，避免被动换基线）。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # native assets（cnativeapi 等）的构建 hook 需要 GTK / X11 开发包：
      # 缺少时 `flutter analyze` / `flutter test` 会直接死在 native assets 阶段
      # （Bad state: pkg-config --cflags gtk+-3.0 x11 xi failed）。
      # 依赖清单与 release.yml 的 Linux job 保持一致，改这里前先对照那边。
      - name: 系统依赖（native assets：GTK / X11）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libx11-dev libxi-dev ninja-build libglu1-mesa

      # 版本与 AGENTS.md 的工具链表保持一致（改这里前先改 AGENTS.md）。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get --enforce-lockfile

      - name: analyze（0 error / 0 warning）
        run: flutter analyze --no-pub

      - name: test
        run: flutter test --no-pub
