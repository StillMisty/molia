name: Integration (Linux)

# 端到端集成测试：真实 QuickJS 引擎 + 本地 mock HTTP 服务 + 真实播放（libmpv）。
# 耗时且依赖系统库，不阻塞 PR：每日定时 + 手动触发。
on:
  workflow_dispatch:
  schedule:
    # 每日 02:00（UTC+8）跑一轮
    - cron: "0 18 * * *"

concurrency:
  group: integration-linux
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  linux-integration:
    name: flutter test -d linux (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 桌面端构建依赖：GTK3、ninja、clang/cmake；播放依赖 libmpv；
      # 集成测试需要显示环境（xvfb）与中文字体（界面文案断言）。
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libmpv2 xvfb fonts-wqy-microhei ninja-build libglu1-mesa

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get --enforce-lockfile

      - name: 集成测试（无 DISPLAY 时 xvfb-run）
        run: xvfb-run -a flutter test integration_test/lx_engine_integration_test.dart -d linux --no-pub -r expanded
