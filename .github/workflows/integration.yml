name: Integration (Linux)

# 端到端集成测试：真实 QuickJS 引擎 + 本地 mock HTTP 服务 + 设置页导入。
# 不含真实播放：无头环境 media_kit/libmpv 的装载卡死无法被 Future.timeout
# 打断，会把 agent / CI 吊死（见 docs/pitfalls.md #33）。
# 耗时且依赖系统库，不阻塞 PR：每日定时 + 手动触发。
on:
  workflow_dispatch:
  schedule:
    # 每日 02:00（UTC+8）跑一轮
    - cron: "0 18 * * *"

concurrency:
  group: integration-linux
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  linux-integration:
    name: flutter test -d linux (xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 桌面端构建依赖：GTK3、ninja、clang/cmake；libmpv 是 media_kit 运行时
      # 依赖（集成测试不播放，但桌面 bundle 启动会加载原生库）；
      # libsecret 是 flutter_secure_storage_linux 的 CMake 依赖（缺失会
      # 直接 "Unable to generate build files"）；托盘（nativeapi build hook）
      # 需要 X11 / Xi 开发文件；集成测试需要显示环境
      # （xvfb）与中文字体（界面文案断言）。
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libmpv2 libsecret-1-dev libx11-dev libxi-dev xvfb fonts-wqy-microhei ninja-build libglu1-mesa

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get --enforce-lockfile

      - name: 集成测试（无 DISPLAY 时 xvfb-run）
        run: |
          xvfb-run -a flutter test integration_test/lx_engine_integration_test.dart -d linux --no-pub -r expanded
