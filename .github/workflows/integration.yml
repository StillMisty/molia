name: Integration (Linux)

# 端到端集成测试：真实 QuickJS 引擎 + 本地 mock HTTP 服务 + 真实播放（libmpv）。
# 耗时且依赖系统库，不阻塞 PR：每日定时 + 手动触发。
on:
  workflow_dispatch:
  schedule:
    # 每日 02:00（UTC+8）跑一轮
    - cron: "0 18 * * *"

concurrency:
  group: integration-linux
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  linux-integration:
    name: flutter test -d linux (xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 桌面端构建依赖：GTK3、ninja、clang/cmake；播放依赖 libmpv；
      # libsecret 是 flutter_secure_storage_linux 的 CMake 依赖（缺失会
      # 直接 "Unable to generate build files"）；托盘（nativeapi build hook）
      # 需要 X11 / Xi 开发文件；集成测试需要显示环境
      # （xvfb）与中文字体（界面文案断言）。
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libmpv2 libsecret-1-dev libx11-dev libxi-dev xvfb fonts-wqy-microhei ninja-build libglu1-mesa \
            pulseaudio pulseaudio-utils

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get --enforce-lockfile

      # 无头 runner 的虚拟音频设备：PulseAudio + null sink。null sink 按实时
      # 速率消费数据，libmpv 才会正常走完播放（对比：ALSA 的 null PCM 不
      # 节流，整首歌瞬间“播完”→自动切歌；无声卡时则是打不开输出，同样
      # 立即判完成）。两者都会让「本地播放」用例必挂。
      - name: 集成测试（无 DISPLAY 时 xvfb-run）
        run: |
          export XDG_RUNTIME_DIR=/tmp/pulse-runtime
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio -D --exit-idle-time=-1 --disable-shm
          pactl load-module module-null-sink sink_name=molia_ci
          pactl set-default-sink molia_ci
          pactl info | head -5
          xvfb-run -a flutter test integration_test/lx_engine_integration_test.dart -d linux --no-pub -r expanded
