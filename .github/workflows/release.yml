name: Release

# 推 `v*` tag 触发：矩阵构建 → 汇总产物 + sha256 + latest.json → GitHub Release。
# 版本约定（见 .agents/skills/molia-release/SKILL.md）：
#   稳定版 v1.2.3 / 测试版 v1.2.3-beta.1（发布为 prerelease）
#   打 tag 前必须先把 pubspec.yaml 的版本改成同一个版本号。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 解析 tag / 校验版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      build: ${{ steps.parse.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: parse
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag 必须是 v1.2.3 或 v1.2.3-beta.1 形式：$tag"
            exit 1
          fi
          version="${tag#v}"
          pubspec="$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml | head -1)"
          if [[ "$version" != "$pubspec" ]]; then
            echo "::error::tag（$version）与 pubspec.yaml（$pubspec）不一致：先把 pubspec.yaml 改成 $version 再打 tag"
            exit 1
          fi
          channel=stable
          prerelease=false
          if [[ "$version" == *-* ]]; then
            channel=beta
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          # 构建号与 Android versionCode 同源：run_number 单调递增，
          # 保证覆盖安装与「有新版本」判定可靠。
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK / AAB
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 插件模块（quickjs / jni / cmake）互不依赖，开跨项目并行；
      # 不启用 Gradle 缓存：tag 构建对 Actions cache 只读，没有 main 预热不会命中。
      GRADLE_OPTS: "-Dorg.gradle.parallel=true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"
      - uses: android-actions/setup-android@v4
      - name: SDK 许可 + NDK
        run: |
          set -euo pipefail
          # 与 android/app/build.gradle 的 ndkVersion / AGENTS.md 工具链表一致。
          ndk_version=30.0.16248370
          # path_provider_android / shared_preferences_android 经 jni 在 Gradle 里
          # 构建 libdartjni，那个模块用 flutter.ndkVersion，即 Flutter 3.47.9 的
          # 默认 28.2.13676358。runner 镜像不保证预装它，缺了 AGP 会在配置期临时
          # 下载，网络抖动就直接失败（beta.37 的 Premature EOF）；显式安装，
          # 让构建只依赖本步骤。
          jni_ndk_version=28.2.13676358
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;$ndk_version" "ndk;$jni_ndk_version"
          for v in "$ndk_version" "$jni_ndk_version"; do
            test -d "$ANDROID_HOME/ndk/$v" || { echo "::error::NDK $v 未安装"; exit 1; }
          done
          # 原生资产（hook）构建由 native_toolchain_c 解析 NDK，优先读 ANDROID_NDK /
          # ANDROID_NDK_HOME；runner 镜像预置的这两项指向默认 NDK 27.x，其 armv7
          # 工具链不完整（链接期找不到 crtbegin_so.o / -llog / -landroid），
          # cnativeapi 这类带 C 代码的包会直接构建失败。显式指向固定版本，与
          # Gradle 侧的 ndkVersion 走同一个 NDK。
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: 还原签名（Secrets，见 .agents/skills/molia-release/SKILL.md）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64（.agents/skills/molia-release/SKILL.md 的 secrets 清单）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/molia-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../molia-release.jks
          EOF
      - name: pub get
        run: flutter pub get --enforce-lockfile
      - name: 构建 APK / AAB
        run: |
          set -euo pipefail
          # APK / AAB 必须共用同一组 AOT 参数，第二次 Gradle 才会 UP-TO-DATE；
          # 否则 AAB 会重新编译 3 个 ABI（实测多 ~145s）。
          # 不要加 --extra-gen-snapshot-options=--strip：AAB 需要 libapp.so.sym，
          # gen_snapshot 提前 strip 会让 flutter build appbundle 的符号校验失败；
          # AGP 打包 release 时本来就会 strip 原生库，去掉后 APK 体积实测不变。
          flags=(
            --release
            --build-name "${{ needs.prepare.outputs.version }}"
            --build-number "${{ needs.prepare.outputs.build }}"
            --target-platform android-arm,android-arm64,android-x64
            --split-debug-info=build/symbols
            --obfuscate
          )
          flutter build apk "${flags[@]}" --split-per-abi
          flutter build appbundle "${flags[@]}"
      - name: 校验 release 资源（shrinkResources 不能删掉通知图标，见已知坑 34）
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          aapt2="$(find "$sdk/build-tools" -name aapt2 | sort -V | tail -1)"
          "$aapt2" dump resources "$apk" > /tmp/release-resources.txt
          missing=0
          for res in ic_notification ic_notification_favorite \
                     ic_notification_favorite_filled \
                     audio_service_play_arrow audio_service_pause \
                     audio_service_skip_previous audio_service_skip_next audio_service_stop \
                     audio_service_repeat_all audio_service_sequential \
                     audio_service_repeat_one audio_service_shuffle; do
            if ! grep -q "drawable/$res" /tmp/release-resources.txt; then
              echo "::error::release 包缺少 @drawable/$res（检查 android/app/src/main/res/raw/keep.xml）"
              missing=1
            fi
          done
          exit "$missing"
      - name: 归一名产物
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/molia-$v-android-armv7.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/molia-$v-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/molia-$v-android-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/molia-$v-android.aab"
          (cd build/symbols && zip -qr "$GITHUB_WORKSPACE/dist/molia-$v-android-symbols.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get --enforce-lockfile
      - name: 安装 Inno Setup（Windows 安装器编译器）
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: 构建 + 打包（便携 zip + 安装器 setup.exe）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = "${{ needs.prepare.outputs.version }}"
          $build = "${{ needs.prepare.outputs.build }}"
          flutter build windows --release --build-name "$v" --build-number "$build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $stage = "dist/molia-$v-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" $stage
          Compress-Archive -Path $stage -DestinationPath "dist/molia-$v-windows-x64.zip" -Force

          # 安装器的版本资源必须是纯数字（预发布后缀进不了 x.y.z.w）。
          $parts = @(($v -split '-')[0].Split('.'))
          while ($parts.Count -lt 3) { $parts += '0' }
          $verNum = (($parts[0..2] + $build) -join '.')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$v" "/DVersionNum=$verNum" `
            "/DSourceDir=$PWD\$stage" "/DOutputDir=$PWD\dist" `
            "windows/installer/molia.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: prepare
    # 统一 ubuntu-latest；glibc 基线随 runner 镜像，老发行版兼容性需单独确认。
    # 运行仍需系统 libmpv（见 .agents/skills/molia-release/references/platforms.md）。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libsecret-1-dev libx11-dev libxi-dev ninja-build libglu1-mesa
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get --enforce-lockfile
      - name: 构建 + 打包
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          flutter build linux --release \
            --build-name "$v" --build-number "${{ needs.prepare.outputs.build }}"
          stage="dist/molia-$v-linux-x64"
          mkdir -p "$stage"
          cp -a build/linux/x64/release/bundle/. "$stage"/
          # 桌面集成资产（.desktop + hicolor 图标 + 安装脚本，布局同 XDG；
          # 维护说明见 linux/packaging/README.md）。
          cp -a linux/packaging/share "$stage"/share
          install -m 0755 linux/packaging/install.sh linux/packaging/uninstall.sh "$stage"/
          tar -czf "dist/molia-$v-linux-x64.tar.gz" -C dist "molia-$v-linux-x64"
          rm -rf "$stage"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  ios:
    name: iOS（无签名校验）
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get --enforce-lockfile
      - name: 构建（无签名；只验证可编译，产物仅供侧载）
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          flutter build ios --release --no-codesign \
            --build-name "$v" --build-number "${{ needs.prepare.outputs.build }}"
          mkdir -p dist
          (cd build/ios/iphoneos && zip -qry "$GITHUB_WORKSPACE/dist/molia-$v-ios-unsigned.zip" Runner.app)
      - uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS（ad-hoc 签名）
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get --enforce-lockfile
      - name: 构建（ad-hoc 签名；产物仅供验证，不入更新清单）
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          flutter build macos --release \
            --build-name "$v" --build-number "${{ needs.prepare.outputs.build }}"
          arch="$(uname -m)"
          if [ "$arch" = "arm64" ]; then arch="arm64"; else arch="x64"; fi
          mkdir -p dist
          # ditto 保留 .app 的符号链接与权限（zip -r 会把 framework 结构压坏）。
          ditto -c -k --keepParent "build/macos/Build/Products/Release/Molia.app" \
            "dist/molia-$v-macos-$arch-unsigned.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: 发布 Release + latest.json
    needs: [prepare, android, windows, linux, ios, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: 生成发布说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > notes.md
      - name: 生成更新清单 latest.json
        run: |
          set -euo pipefail
          python3 tool/ci/gen_update_manifest.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "${{ needs.prepare.outputs.version }}" \
            --build "${{ needs.prepare.outputs.build }}" \
            --channel "${{ needs.prepare.outputs.channel }}" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --notes-file notes.md \
            --assets-dir dist \
            --output dist/latest.json
      - name: 校验和
        run: |
          cd dist && sha256sum molia-* > SHA256SUMS.txt
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(
            "$GITHUB_REF_NAME"
            --title "Molia ${{ needs.prepare.outputs.version }}"
            --notes-file notes.md
          )
          if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" dist/molia-* dist/latest.json dist/SHA256SUMS.txt
      - name: 更新测试渠道滚动清单（beta tag）
        if: needs.prepare.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 固定 release tag `beta`：客户端取 releases/download/beta/latest.json，
          # 无需 GitHub API。latest.json 资产原地覆盖以指向最新测试版；
          # 不删除重建 release，避免删除到重建之间该 URL 出现 404。
          mkdir -p beta-dist
          cp dist/latest.json beta-dist/
          if gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload beta beta-dist/latest.json \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit beta \
              --prerelease \
              --title "Beta channel" \
              --notes "测试渠道滚动清单（latest.json 指向最新测试版）。" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create beta \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Beta channel" \
              --notes "测试渠道滚动清单（latest.json 指向最新测试版）。" \
              --repo "$GITHUB_REPOSITORY" \
              beta-dist/latest.json
          fi
